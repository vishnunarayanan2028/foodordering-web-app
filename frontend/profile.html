<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Food Munch</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4b6aa4f9ba.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/common.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/images/food-munch-img.svg" alt="Food Munch Logo" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/menu.html">Menu</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="authNav"></ul>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 100px; min-height: 60vh;">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="custom-card p-4">
                    <h2 class="mb-4 text-center">My Profile</h2>
                    <div class="text-center mb-4">
                        <i class="fas fa-user-circle text-muted" style="font-size: 5rem;"></i>
                    </div>
                    <form id="profileForm">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" class="form-control" id="profileName" disabled>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" class="form-control" id="profileEmail" disabled>
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="text" class="form-control" id="profilePhone" disabled>
                        </div>
                        <!-- In a real app, we'd add edit functionality here -->
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="/js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = ApiClient.getUser();
            if (!user) {
                window.location.href = '/login.html';
                return;
            }
            document.getElementById('profileName').value = user.name;
            document.getElementById('profileEmail').value = user.email;
            document.getElementById('profilePhone').value = user.phone || '';
        });
    </script>
</body>
</html>
