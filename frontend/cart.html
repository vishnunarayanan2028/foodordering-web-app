<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - Food Munch</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4b6aa4f9ba.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/cart.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/images/food-munch-img.svg" alt="Food Munch Logo" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/menu.html">Menu</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="authNav"></ul>
                <a href="/cart.html" class="nav-link position-relative active" id="cartNav" style="display:none; color: var(--primary-accent);">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                    <span class="cart-badge" id="cartBadgeCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 100px; min-height: 60vh;">
        <h2 class="mb-4">Shopping Cart</h2>
        
        <div id="loadingIndicator" class="text-center my-5">
            <div class="loading-spinner"></div>
        </div>

        <div id="emptyCart" class="text-center my-5" style="display:none;">
            <i class="fas fa-shopping-basket fa-4x text-muted mb-3"></i>
            <h4>Your cart is empty</h4>
            <p class="text-muted">Looks like you haven't added anything to your cart yet.</p>
            <a href="/menu.html" class="custom-button mt-3 d-inline-block">Browse Menu</a>
        </div>

        <div class="row" id="cartContent" style="display:none;">
            <div class="col-lg-8 mb-4">
                <div class="custom-card">
                    <div id="cartItemsList">
                        <!-- Items injected here -->
                    </div>
                </div>
            </div>
            <div class="col-lg-4">
                <div class="custom-card summary-card">
                    <h4>Order Summary</h4>
                    <hr>
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="summarySubtotal">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (5%)</span>
                        <span id="summaryTax">₹0</span>
                    </div>
                    <div class="summary-row">
                        <span>Delivery Fee</span>
                        <span id="summaryDelivery">₹40</span>
                    </div>
                    <div class="summary-row summary-total">
                        <span>Total</span>
                        <span id="summaryTotal" class="text-primary-custom">₹0</span>
                    </div>
                    <a href="/checkout.html" class="custom-button btn-block text-center mt-4">Proceed to Checkout</a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center">
        <div class="container">
            <p>&copy; 2024 Food Munch. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/cart.js"></script>
</body>
</html>
