<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Munch</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4b6aa4f9ba.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/images/food-munch-img.svg" alt="Food Munch Logo" height="40">
            </a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/menu.html">Menu</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="authNav"></ul>
                <a href="/cart.html" class="nav-link position-relative" id="cartNav" style="display:none; color: var(--heading-color);">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                    <span class="cart-badge" id="cartBadgeCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="custom-card auth-card">
            <h2>Welcome Back</h2>
            <p class="text-muted text-center mb-4">Log in to order delicious food</p>
            
            <div id="errorMsg" class="alert alert-danger" style="display:none;"></div>
            
            <!-- Quick Demo Accounts -->
            <div class="mb-4 p-3 bg-light rounded border">
                <div class="small font-weight-bold text-uppercase text-muted mb-2 text-center">
                    <i class="fas fa-magic text-warning mr-1"></i> Quick 1-Click Demo Login
                </div>
                <div class="d-flex flex-wrap justify-content-between">
                    <button type="button" class="btn btn-sm btn-outline-primary m-1 flex-grow-1" onclick="fillDemoCredentials('customer@demo.com', 'Demo@123')">
                        <i class="fas fa-user mr-1"></i> Customer
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-success m-1 flex-grow-1" onclick="fillDemoCredentials('restaurant@demo.com', 'Demo@123')">
                        <i class="fas fa-store mr-1"></i> Restaurant
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-dark m-1 flex-grow-1" onclick="fillDemoCredentials('admin@demo.com', 'Demo@123')">
                        <i class="fas fa-shield-alt mr-1"></i> Admin
                    </button>
                </div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-envelope text-muted"></i></span>
                        </div>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text"><i class="fas fa-lock text-muted"></i></span>
                        </div>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required autocomplete="current-password">
                    </div>
                </div>
                <button type="submit" class="custom-button btn-block mt-4" id="loginBtn">Login</button>
            </form>
            <div class="auth-link mt-3">
                Don't have an account? <a href="/register.html">Register here</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer text-center">
        <div class="container">
            <p>&copy; 2024 Food Munch. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
