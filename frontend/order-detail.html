<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Detail - Food Munch</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4b6aa4f9ba.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/orders.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <img src="/images/food-munch-img.svg" alt="Food Munch Logo" height="40">
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/menu.html">Menu</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="authNav"></ul>
                <a href="/cart.html" class="nav-link position-relative" id="cartNav" style="display:none;">
                    <i class="fas fa-shopping-cart fa-lg"></i>
                    <span class="cart-badge" id="cartBadgeCount">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 100px; min-height: 60vh;">
        <div id="loadingIndicator" class="text-center my-5"><div class="loading-spinner"></div></div>
        
        <div id="orderDetailContent" style="display:none;">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Order <span id="orderNum"></span></h2>
                <button id="cancelOrderBtn" class="btn btn-outline-danger" style="display:none;">Cancel Order</button>
            </div>
            
            <div class="row">
                <div class="col-lg-4 mb-4">
                    <div class="custom-card p-4 h-100">
                        <h5 class="mb-4">Status</h5>
                        <div class="mb-3">
                            <span id="orderStatusBadge"></span>
                        </div>
                        <p class="text-muted small mb-4" id="orderDate"></p>
                        <div class="timeline" id="orderTimeline"></div>
                    </div>
                </div>
                
                <div class="col-lg-8 mb-4">
                    <div class="custom-card p-0 mb-4 overflow-hidden">
                        <table class="table mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th>Item</th>
                                    <th class="text-center">Qty</th>
                                    <th class="text-right">Price</th>
                                    <th class="text-right">Total</th>
                                </tr>
                            </thead>
                            <tbody id="orderItemsTable"></tbody>
                        </table>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-4">
                            <div class="custom-card p-4 h-100">
                                <h5 class="mb-3">Delivery Info</h5>
                                <p class="mb-0 text-muted" id="detailAddress" style="white-space: pre-line;"></p>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <div class="custom-card p-4 h-100">
                                <h5 class="mb-3">Payment Summary</h5>
                                <div class="d-flex justify-content-between mb-2"><span>Subtotal</span><span id="detailSubtotal"></span></div>
                                <div class="d-flex justify-content-between mb-2"><span>Tax</span><span id="detailTax"></span></div>
                                <div class="d-flex justify-content-between mb-2"><span>Delivery</span><span id="detailDelivery"></span></div>
                                <hr>
                                <div class="d-flex justify-content-between font-weight-bold"><span>Total</span><span id="detailTotal" class="text-primary-custom"></span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/orders.js"></script>
</body>
</html>
