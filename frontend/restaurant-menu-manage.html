<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant - Menu - Food Munch</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4b6aa4f9ba.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">Food Munch Partner</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item"><a class="nav-link" href="/restaurant-dashboard.html">Dashboard</a></li>
                    <li class="nav-item active"><a class="nav-link" href="/restaurant-menu-manage.html">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="/restaurant-orders.html">Orders</a></li>
                </ul>
                <ul class="navbar-nav align-items-center" id="authNav"></ul>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 100px; min-height: 60vh;">
        <h2 class="mb-4">Manage Menu</h2>
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="custom-card p-4">
                    <h5 class="mb-3">Categories</h5>
                    <ul class="list-group mb-3" id="restCategoriesList"></ul>
                    <button class="custom-outline-button btn-block" disabled>Add Category</button>
                </div>
            </div>
            <div class="col-md-8 mb-4">
                <div class="custom-card p-0 overflow-hidden">
                    <div class="p-3 bg-light d-flex justify-content-between align-items-center border-bottom">
                        <h5 class="mb-0">Food Items</h5>
                        <button class="custom-button btn-sm" disabled>Add Item</button>
                    </div>
                    <table class="table table-custom mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Type</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="restFoodsTable">
                            <!-- Foods injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/restaurant.js"></script>
</body>
</html>
